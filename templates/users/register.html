{% extends 'base.html' %}
{% load static %}
{% block title %}Register - Job Posting Portal{% endblock %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h3 class="mb-0 fw-bold">Create an Account</h3>
                    <p class="mb-0 text-white-50">Join the thousands already hired</p>
                </div>
                <div class="card-body p-5">
                    <form id="register-form">
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="first_name" class="form-label fw-semibold">First Name</label>
                                <input type="text" class="form-control form-control-lg bg-light" id="first_name" required>
                            </div>
                            <div class="col-md-6">
                                <label for="last_name" class="form-label fw-semibold">Last Name</label>
                                <input type="text" class="form-control form-control-lg bg-light" id="last_name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control form-control-lg bg-light" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email address</label>
                            <input type="email" class="form-control form-control-lg bg-light" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control form-control-lg bg-light" id="password" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold d-block">I am a:</label>
                            <div class="btn-group w-100" role="group" aria-label="Role Selection">
                                <input type="radio" class="btn-check" name="role" id="role_candidate" value="candidate" autocomplete="off" checked>
                                <label class="btn btn-outline-primary py-2" for="role_candidate"><i class="bi bi-person me-2"></i>Job Seeker</label>
                            
                                <input type="radio" class="btn-check" name="role" id="role_employer" value="employer" autocomplete="off">
                                <label class="btn btn-outline-primary py-2" for="role_employer"><i class="bi bi-building me-2"></i>Employer</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">Sign Up</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const first_name = document.getElementById('first_name').value;
        const last_name = document.getElementById('last_name').value;
        const role = document.querySelector('input[name="role"]:checked').value;
        
        showLoader();
        try {
            const response = await fetch('/api/auth/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': CSRF_TOKEN
                },
                body: JSON.stringify({ username, email, password, first_name, last_name, role })
            });

            if(response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showToast('Registration successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    if(data.user.role === 'employer') {
                        window.location.href = "{% url 'employer_dashboard' %}";
                    } else {
                        window.location.href = "{% url 'candidate_dashboard' %}";
                    }
                }, 1500);
            } else {
                const errorData = await response.json();
                console.log(errorData);
                let errMsg = 'Registration failed. ';
                for(let key in errorData) errMsg += `${key}: ${errorData[key][0]} `;
                showToast(errMsg, 'danger');
            }
        } catch(err) {
            console.error(err);
            showToast('An error occurred during registration.', 'danger');
        } finally {
            hideLoader();
        }
    });
</script>
{% endblock %}
