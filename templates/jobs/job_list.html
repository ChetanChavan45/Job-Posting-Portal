{% extends 'base.html' %}
{% load static %}
{% block title %}Explore Jobs - Job Posting Portal{% endblock %}

{% block content %}
<div class="container py-5 mt-4">
    <div class="row mb-5 align-items-center">
        <div class="col-lg-6">
            <h1 class="display-5 fw-bold mb-3 animate-fade-in">Find Your Next <span class="text-primary">Opportunity</span></h1>
            <p class="lead text-muted">Browse through thousands of job listings to find the perfect match for you.</p>
        </div>
        <div class="col-lg-6">
            <div class="bg-white p-4 rounded-4 shadow-sm">
                <form id="filter-form" class="row g-3">
                    <div class="col-md-12 mb-2">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control bg-light border-start-0 ps-0" id="search-q" placeholder="Job title, company, or skills">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="filter-type" class="form-select form-select-lg">
                            <option value="">Job Type</option>
                            <option value="full-time">Full-time</option>
                            <option value="part-time">Part-time</option>
                            <option value="internship">Internship</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <select id="filter-location" class="form-select form-select-lg">
                            <option value="">Location</option>
                            <option value="Remote">Remote</option>
                            <option value="New York">New York</option>
                            <option value="San Francisco">San Francisco</option>
                            <option value="London">London</option>
                            <option value="Berlin">Berlin</option>
                            <option value="Mumbai">Mumbai</option>
                            <option value="Bangalore">Bangalore</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary btn-lg w-100">Filter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Jobs List Grid -->
    <div id="jobs-container" class="row g-4">
        <!-- Populated via JS -->
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-5">
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-lg" id="pagination-controls">
                <!-- Populated via JS -->
            </ul>
        </nav>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let nextUrl = null;
    let prevUrl = null;

    document.addEventListener("DOMContentLoaded", () => {
        // Init filters from URL params if present
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('q')) document.getElementById('search-q').value = urlParams.get('q');
        if(urlParams.get('location')) document.getElementById('filter-location').value = urlParams.get('location');
        if(urlParams.get('job_type')) document.getElementById('filter-type').value = urlParams.get('job_type');

        fetchJobsList();

        document.getElementById('filter-form').addEventListener('submit', (e) => {
            e.preventDefault();
            currentPage = 1;
            fetchJobsList();
        });
    });

    async function fetchJobsList(url = null) {
        showLoader();
        try {
            const q = document.getElementById('search-q').value;
            const type = document.getElementById('filter-type').value;
            const loc = document.getElementById('filter-location').value;

            let fetchUrl = url || `/api/jobs/?page=${currentPage}&search=${encodeURIComponent(q)}&job_type=${encodeURIComponent(type)}&location=${encodeURIComponent(loc)}`;
            
            const response = await fetch(fetchUrl);
            if(response.ok) {
                const data = await response.json();
                renderJobs(data.results, 'jobs-container');
                nextUrl = data.next;
                prevUrl = data.previous;
                renderPagination(data.count);
            }
        } catch(error) {
            console.error("Error fetching jobs:", error);
            showToast("Failed to load jobs.", "danger");
        } finally {
            hideLoader();
        }
    }

    function renderPagination(totalCount) {
        const pagination = document.getElementById('pagination-controls');
        pagination.innerHTML = '';
        
        if (!prevUrl && !nextUrl) return;

        let html = '';
        html += `<li class="page-item ${!prevUrl ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(event, '${prevUrl}', -1)">Previous</a>
        </li>`;
        html += `<li class="page-item active"><span class="page-link">${currentPage}</span></li>`;
        html += `<li class="page-item ${!nextUrl ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="changePage(event, '${nextUrl}', 1)">Next</a>
        </li>`;
        
        pagination.innerHTML = html;
    }

    function changePage(e, url, pageDelta) {
        e.preventDefault();
        if(url && url !== 'null') {
            currentPage += pageDelta;
            fetchJobsList(url);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
</script>
{% endblock %}
